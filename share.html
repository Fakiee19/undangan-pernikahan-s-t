<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <title>Generator Undangan WA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --maroon-800: #6b2433;
      --maroon-600: #943f4f;
      --maroon-400: #c46675;
      --maroon-100: #f8ecee;
      --ink: #1a0c10;
      --bg: #fdf5f6;
    }

    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      color: var(--maroon-800);
    }

    .header p {
      margin: 0;
      color: #555;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(107, 36, 51, 0.08);
      border: 1px solid rgba(107, 36, 51, 0.1);
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--maroon-800);
    }

    input,
    textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--maroon-400);
      box-shadow: 0 0 0 3px rgba(196, 102, 117, 0.2);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(180deg, var(--maroon-600) 0%, var(--maroon-800) 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(107, 36, 51, 0.25);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #fff;
      color: var(--maroon-800);
      border: 1px solid var(--maroon-800);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: var(--maroon-100);
      box-shadow: none;
    }

    .copy-success {
      display: none;
      text-align: center;
      color: #2e7d32;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .note {
      font-size: 0.85rem;
      color: #777;
      margin-top: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Kirim Undangan WA</h1>
    <p>Buat link spesifik untuk setiap tamu dan langsung kirim via WhatsApp</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="guestName">Nama Penerima (Tamu)</label>
      <input type="text" id="guestName" placeholder="Contoh: Bapak Budi & Keluarga" autocomplete="off" />
    </div>

    <div class="field">
      <label for="guestWa">Nomor WA Penerima (Opsional)</label>
      <input type="tel" id="guestWa" placeholder="Contoh: 08123456789" autocomplete="off" />
      <div class="note">Kosongkan jika ingin memilih kontak langsung dari WA.</div>
    </div>

    <div class="field">
      <label for="message">Template Pesan</label>
      <textarea id="message" rows="12"></textarea>
    </div>

    <button type="button" class="btn" id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"></path>
        <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
      </svg>
      Kirim via WhatsApp
    </button>
    <button type="button" class="btn btn-secondary" id="copyBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      Salin Pesan Saja
    </button>
    <div class="copy-success" id="copySuccess">Teks pesan berhasil disalin!</div>
  </div>

  <script>
    (function () {
      let baseUrl = window.location.href.split("share.html")[0];
      if (baseUrl.endsWith("/")) {
        baseUrl = baseUrl.slice(0, -1);
      }
      const invitationUrl = baseUrl + "/index.html";

      const guestNameInput = document.getElementById("guestName");
      const guestWaInput = document.getElementById("guestWa");
      const messageInput = document.getElementById("message");
      const sendBtn = document.getElementById("sendBtn");
      const copyBtn = document.getElementById("copyBtn");
      const copySuccess = document.getElementById("copySuccess");

      function updateMessage() {
        const name = guestNameInput.value.trim() || "[Nama Tamu]";
        const link = invitationUrl + "?to=" + encodeURIComponent(name);

        const msg =
          "Kepada Yth. " +
          name +
          ",\n\n" +
          "Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:\n\n" +
          "Supriyadi & Hayu Kartikasari\n" +
          "Minggu, 24 Mei 2026\n\n" +
          "Berikut tautan undangan digital kami untuk detail acara selengkapnya:\n" +
          link +
          "\n\n" +
          "Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.\n\n" +
          "Terima kasih.";

        messageInput.value = msg;
      }

      guestNameInput.addEventListener("input", updateMessage);
      updateMessage();

      sendBtn.addEventListener("click", function () {
        let wa = guestWaInput.value.replace(/\D/g, "");

        if (wa.startsWith("0")) {
          wa = "62" + wa.substring(1);
        }

        const text = encodeURIComponent(messageInput.value);

        let waUrl = "https://wa.me/" + wa + "?text=" + text;
        if (!wa) {
          waUrl = "https://wa.me/?text=" + text;
        }

        window.open(waUrl, "_blank");
      });

      copyBtn.addEventListener("click", function () {
        const text = messageInput.value;
        navigator.clipboard.writeText(text).then(function () {
          copySuccess.style.display = "block";
          setTimeout(function () {
            copySuccess.style.display = "none";
          }, 2500);
        });
      });
    })();
  </script>
</body>

</html>
